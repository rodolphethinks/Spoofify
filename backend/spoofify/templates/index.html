<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spoofify</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .logo { font-size: 2rem; font-weight: 800; color: #1db954; margin-bottom: .5rem; }
    .sub  { font-size: .9rem; color: #b3b3b3; margin-bottom: 2rem; }
    form  { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: .75rem; }
    input[type="url"] {
      width: 100%;
      padding: .75rem 1rem;
      border-radius: 8px;
      border: 1px solid #535353;
      background: #282828;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input[type="url"]:focus { border-color: #1db954; }
    button {
      padding: .75rem;
      border-radius: 8px;
      border: none;
      background: #1db954;
      color: #000;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1ed760; }
    .error {
      color: #ff6b6b;
      font-size: .85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo">Spoofify</div>
  <div class="sub">Paste any public Spotify playlist or album link</div>
  <form action="/player" method="get">
    <input
      type="url"
      name="url"
      placeholder="https://open.spotify.com/playlist/…"
      required
      autofocus
    />
    <button type="submit">Load playlist →</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
</body>
</html>
